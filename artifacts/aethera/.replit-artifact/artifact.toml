kind = "web"
previewPath = "/"
title = "Aethera"
version = "1.0.0"
id = "artifacts/aethera"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20619

[services.development]
run = "pnpm --filter @workspace/aethera run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/aethera", "run", "build" ]
serve = "static"
publicDir = "artifacts/aethera/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20619"
BASE_PATH = "/"
